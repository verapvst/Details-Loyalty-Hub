<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analysis · Details Loyalty Hub</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div id="nav-root"></div>

<div class="lab-header">
  <p class="lab-subtitle">A workspace for exploring patterns across the loyalty programme database.</p>
  <p class="lab-orientation" id="lab-orientation">Loading…</p>

  <div class="lab-filter-row">
    <div class="filter-chips" id="filter-chips"></div>
    <div class="filter-add-wrap">
      <button type="button" class="filter-add-btn" id="filter-add-btn">+ Add filter</button>
      <div class="filter-add-panel" id="filter-add-panel" hidden></div>
    </div>
  </div>
</div>

<div class="lab-tabs-wrap group-tabs">
  <div class="lab-tabs">
    <a class="lab-tab" href="index.html">Database</a>
    <span class="lab-tab active">Analysis</span>
    <a class="lab-tab" href="favorites.html">Favorites</a>
  </div>
</div>

<div class="lab-tabs-wrap">
  <div class="lab-tabs">
    <button type="button" class="lab-tab" data-tab="explore">Explore</button>
    <button type="button" class="lab-tab" data-tab="relate">Relate</button>
    <button type="button" class="lab-tab" data-tab="trends">Trends</button>
    <button type="button" class="lab-tab" data-tab="tiers">Pricing</button>
    <button type="button" class="lab-tab" data-tab="mechanisms">Mechanisms</button>
    <button type="button" class="lab-tab" data-tab="saved">Saved</button>
  </div>
</div>

<main class="lab-main">
  <section class="workspace" id="workspace-explore"></section>
  <section class="workspace" id="workspace-relate"></section>
  <section class="workspace" id="workspace-trends"></section>
  <section class="workspace" id="workspace-tiers"></section>
  <section class="workspace" id="workspace-mechanisms"></section>
  <section class="workspace" id="workspace-saved"><div id="saved-root"></div></section>
</main>

<div id="analysis-modal-root"></div>

<script type="module" src="assets/analysis.js"></script>
</body>
</html>

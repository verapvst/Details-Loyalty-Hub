<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Favorites · Details Loyalty Hub</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div id="nav-root"></div>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <h1>Favorites</h1>
      <p>Every observation the team has flagged as interesting, in one place. Filter by Mechanism, Feature or Programme to see it aggregated.</p>
    </div>
    <button class="btn-primary" id="btn-add-favourite" type="button">+ Add Favourite</button>
  </div>
</div>

<div class="lab-tabs-wrap group-tabs">
  <div class="lab-tabs">
    <a class="lab-tab" href="index.html">Database</a>
    <a class="lab-tab" href="analysis.html">Analysis</a>
    <span class="lab-tab active">Favorites</span>
  </div>
</div>

<div class="filter-bar-wrap">
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Type</span>
      <select class="filter-select" id="filter-type"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Programme</span>
      <select class="filter-select" id="filter-programme"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Added by</span>
      <select class="filter-select" id="filter-added-by"><option value="">All</option></select>
    </div>
    <button class="btn-clear-filters" id="btn-clear-filters" type="button">Clear filters</button>
    <input class="search-input" id="search-input" type="search" placeholder="Search programme, feature, notes…" />
  </div>
</div>

<section class="section">
  <div class="section-head">
    <h2 class="section-title">Liked Observations</h2>
    <span class="section-count" id="section-count"></span>
  </div>
  <div id="favorite-list" class="lib-list">
    <div class="loading-state">Loading…</div>
  </div>
</section>

<script type="module" src="assets/favorites.js"></script>
</body>
</html>

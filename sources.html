<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sources · Details Loyalty Hub</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div id="nav-root"></div>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <h1>Sources</h1>
      <p>Classify each source once (name, author/organisation, year, type and scope) and reuse it for every Insight extracted from it in Data &amp; Insights.</p>
    </div>
    <button class="btn-primary" id="btn-add-source" type="button">+ Add Source</button>
  </div>
</div>

<div class="filter-bar-wrap">
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Sort</span>
      <select class="filter-select" id="sort-select">
        <option value="recent-use">Recently Used</option>
        <option value="recent-add">Recently Added</option>
        <option value="az">A–Z</option>
        <option value="za">Z–A</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Type</span>
      <select class="filter-select" id="filter-type"><option value="">All</option></select>
    </div>
    <div class="filter-group scope-filter">
      <span class="filter-label">Scope</span>
      <button type="button" class="filter-select" id="scope-filter-btn">All</button>
      <div class="scope-filter-panel" id="scope-filter-panel" hidden></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Added by</span>
      <select class="filter-select" id="filter-added-by"><option value="">All</option></select>
    </div>
    <button class="btn-clear-filters" id="btn-clear-filters" type="button">Clear filters</button>
    <input class="search-input" id="search-input" type="search" placeholder="Search by name, author or type…" />
  </div>
</div>

<section class="section">
  <div class="section-head">
    <span class="section-count" id="section-count"></span>
  </div>
  <div id="source-list" class="list-rows">
    <div class="loading-state">Loading sources…</div>
  </div>
</section>


<script type="module" src="assets/sources.js"></script>
</body>
</html>

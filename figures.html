<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data &amp; Insights · Details Loyalty Hub</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div id="nav-root"></div>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <h1>Data &amp; Insights</h1>
      <p>Reusable findings, statistics and takeaways extracted from our Sources — not another source library, just the useful pieces we want to reuse.</p>
    </div>
    <button class="btn-primary" id="btn-add-insight" type="button">+ Add Insight</button>
  </div>
</div>

<div class="type-legend-wrap"><div class="type-legend" id="type-legend"></div></div>

<div class="filter-bar-wrap">
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Type</span>
      <select class="filter-select" id="filter-type"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Visual</span>
      <select class="filter-select" id="filter-visual"><option value="">All</option></select>
    </div>
    <div class="filter-group scope-filter">
      <span class="filter-label">Scope</span>
      <button type="button" class="filter-select" id="scope-filter-btn">All</button>
      <div class="scope-filter-panel" id="scope-filter-panel" hidden></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Source</span>
      <select class="filter-select" id="filter-source"><option value="">All</option></select>
    </div>
    <button class="btn-clear-filters" id="btn-clear-filters" type="button">Clear filters</button>
    <input class="search-input" id="search-input" type="search" placeholder="Search insights…" />
  </div>
</div>

<section class="section">
  <div class="section-head">
    <span class="section-count" id="section-count"></span>
  </div>
  <div id="no-sources-note" class="empty-state" hidden>
    <div class="em-title">Add a source first</div>
    <p>Insights must be linked to a source. <a href="sources.html" style="color: var(--accent); text-decoration: underline;">Go to Sources</a> to add one.</p>
  </div>
  <div id="insight-list" class="lib-list">
    <div class="loading-state">Loading insights…</div>
  </div>
</section>


<script type="module" src="assets/figures.js"></script>
</body>
</html>

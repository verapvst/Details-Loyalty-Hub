<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Schedules &amp; Tasks · Details Loyalty Hub</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div id="nav-root"></div>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <h1>Schedules &amp; Tasks</h1>
      <p>The team's shared project calendar and task list, from now through thesis submission.</p>
    </div>
  </div>
</div>

<section class="section" style="padding-bottom: 0;">
  <div id="milestone-strip">
    <div class="loading-state">Loading…</div>
  </div>
</section>

<div class="lab-tabs-wrap">
  <div class="lab-tabs">
    <button type="button" class="lab-tab" data-tab="calendar">Calendar</button>
    <button type="button" class="lab-tab" data-tab="tasks">Tasks</button>
    <button type="button" class="lab-tab" data-tab="polls">Polls</button>
  </div>
</div>

<div class="workspace" id="workspace-calendar">
  <section class="section" style="padding-top: 24px; padding-bottom: 24px;">
    <div class="section-head">
      <h2 class="section-title">Calendar</h2>
      <div class="view-toggle" id="calendar-view-toggle">
        <button type="button" data-view="agenda">Agenda</button>
        <button type="button" data-view="month" class="active">Month</button>
      </div>
      <button class="btn-outline" id="btn-add-meeting" type="button">+ Add Meeting</button>
    </div>
    <div id="calendar-agenda" hidden>
      <div class="loading-state">Loading…</div>
    </div>
    <div id="calendar-month"></div>
  </section>
</div>

<div class="workspace" id="workspace-tasks">
  <section class="section" style="padding-top: 24px; padding-bottom: 24px;">
    <div class="section-head">
      <h2 class="section-title">Tasks</h2>
      <button class="btn-primary" id="btn-add-task" type="button">+ Add Task</button>
    </div>
    <div id="task-list">
      <div class="loading-state">Loading…</div>
    </div>
  </section>
</div>

<div class="workspace" id="workspace-polls">
  <section class="section" style="padding-top: 24px; padding-bottom: 24px;">
    <div class="section-head">
      <h2 class="section-title">Meeting Polls</h2>
      <button class="btn-outline" id="btn-add-poll" type="button">+ New Poll</button>
    </div>
    <div id="poll-list">
      <div class="loading-state">Loading…</div>
    </div>
  </section>
</div>

<div id="add-meeting-root"></div>
<div id="edit-meeting-root"></div>
<div id="add-poll-root"></div>
<div id="edit-poll-root"></div>
<div id="schedule-meeting-root"></div>
<div id="add-task-root"></div>
<div id="edit-task-root"></div>

<script type="module" src="assets/tasks.js"></script>
</body>
</html>
